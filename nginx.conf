# -------------------------------------------------------------------
# www → 非 www 规范化重定向（SEO）
# www.wscard.games 一律 301 到 https://wscard.games/ 主域名，
# 避免重复内容与无效索引。此块靠 server_name 精确匹配 Host，
# 其余 Host（含 wscard.games）命中下方默认块正常服务。
# -------------------------------------------------------------------
server {
    listen $PORT;
    server_name www.wscard.games;
    return 301 https://wscard.games$request_uri;
}

server {
    listen $PORT default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 301 的 Location 一律输出相对路径。
    # 不设这一行时 nginx 会用 $scheme + $host + $server_port 拼绝对地址，
    # 在 Railway 上就变成 http://wscard.games:8080/en —— 协议和端口都是错的，
    # 爬虫会跟着跳到一个打不开的地址（GSC「重定向错误」）。
    absolute_redirect off;

    # 压缩：HTML/JS/wasm 体积降 60-80%，改善 LCP 与爬虫抓取预算
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/json application/manifest+json
               text/javascript application/javascript application/wasm image/svg+xml;

    # =========================================================
    # 缓存策略（改善重访加载，同时确保新版本能及时发布）
    #
    # Flutter web 产物文件名是固定的（main.dart.mjs / main.dart.wasm
    # / skwasm.js 等都不带内容哈希），所以不能用无条件 immutable——
    # 否则每次构建后浏览器会命中旧缓存看不到更新。
    #
    # 策略：
    #   - 入口/版本控制文件（index.html / flutter_bootstrap.js /
    #     flutter_service_worker.js / version.json）：绝不缓存(no-cache)，
    #     每次用 ETag 校验，确保新版本能发布。
    #   - 引擎与静态资源（canvaskit/ 下 wasm/js、assets/ 下 webp/字体/
    #     图片）：长缓存。这些文件相对稳定，且 Flutter 的 service worker
    #     在版本变化时负责刷新它们，所以加 immutable 能显著改善重访。
    #   - 主应用产物（main.dart.mjs / main.dart.wasm / main.dart.js）：
    #     no-cache，随每次构建变化，必须 revalidate。
    # =========================================================

    # ES module (.mjs) 必须返回 text/javascript，否则浏览器拒绝动态 import
    # （skwasm/dart2wasm 运行时靠 import(main.dart.mjs) 启动）。
    # mime.types 无 .mjs 定义时默认返回 application/octet-stream，
    # 浏览器拒绝动态 import 导致白屏；此 location 强制指定为 JS MIME。
    # 注意：不能在此 server 块用 types{}（会整体替换默认 MIME 映射），
    # 故用 location 级 default_type。
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 主应用产物（wasm / js）：no-cache，配合 ETag 校验
    location ~* \.(wasm|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 入口 / 版本控制文件：绝不缓存
    location = /index.html            { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js  { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /version.json          { add_header Cache-Control "no-cache"; }

    # 引擎与渲染层（skwasm / canvaskit）：长缓存（^~ 使前缀优先于正则）
    location ^~ /canvaskit/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 静态资源（图片 / 字体 / 音频等）：长缓存
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # =========================================================
    # URL 规范（GSC 索引问题的根因修复）
    #
    # 原则：一个页面只有一个返回 200 的「规范地址」，
    #       规范地址一律「无 .html 后缀、无结尾斜杠」。
    #       /en  /ja  /ko  /th  /vi  /de  /zh-tw  /blog/rules-zh ...
    #
    # 全部旧形式（*.html、结尾斜杠）都用 301 收敛到规范地址，
    # 否则同一内容被多个 URL 抓取 —— 正是 GSC 里
    # 「备用网页（有适当的规范标记）」与「网页会自动重定向」的来源。
    # =========================================================

    # 结尾斜杠归一：/ja/ → /ja、/privacy/ → /privacy、/blog/ → /blog
    rewrite ^/(.+[^/])/$ /$1 permanent;

    # ---- 旧 .html 地址 → 301 规范地址 -------------------------------
    location = /landing.html                   { return 301 /en; }
    location = /landing-jp.html                { return 301 /ja; }
    location = /landing-kr.html                { return 301 /ko; }
    location = /landing-th.html                { return 301 /th; }
    location = /landing-vi.html                { return 301 /vi; }
    location = /landing-de.html                { return 301 /de; }
    location = /zh-tw.html                     { return 301 /zh-tw; }
    location = /about.html                     { return 301 /about; }
    location = /download.html                  { return 301 /download; }
    location = /promo.html                     { return 301 /promo; }
    location = /privacy.html                   { return 301 /privacy; }
    location = /terms.html                     { return 301 /terms; }
    location = /data-deletion.html             { return 301 /data-deletion; }
    location = /blog/rules-zh.html             { return 301 /blog/rules-zh; }
    location = /blog/getting-started-guide.html { return 301 /blog/getting-started-guide; }
    location = /blog/seven-schools-guide.html  { return 301 /blog/seven-schools-guide; }
    # 旧短链 /landing 视作 /en 的历史别名
    location = /landing                        { return 301 /en; }

    # ---- 广告投放变体：保持 200 但不参与收录（meta noindex） --------
    # 不做 301，避免已投放的广告链接被改写；也不让站内引用它们。
    location = /landing-eu.html  { default_type text/html; try_files /landing-eu.html =404; }
    location = /landing-sea.html { default_type text/html; try_files /landing-sea.html =404; }

    # ---- 规范地址：无后缀，直接出对应静态文件（200）----------------
    # 语言落地页
    location = /en     { default_type text/html; try_files /landing.html =404; }
    location = /ja     { default_type text/html; try_files /landing-jp.html =404; }
    location = /ko     { default_type text/html; try_files /landing-kr.html =404; }
    location = /th     { default_type text/html; try_files /landing-th.html =404; }
    location = /vi     { default_type text/html; try_files /landing-vi.html =404; }
    location = /de     { default_type text/html; try_files /landing-de.html =404; }
    location = /zh-tw  { default_type text/html; try_files /zh-tw.html =404; }
    # 介绍 / 下载 / 投放 / 法律页
    location = /about         { default_type text/html; try_files /about.html =404; }
    location = /download      { default_type text/html; try_files /download.html =404; }
    location = /promo         { default_type text/html; try_files /promo.html =404; }
    location = /privacy       { default_type text/html; try_files /privacy.html =404; }
    location = /terms         { default_type text/html; try_files /terms.html =404; }
    location = /data-deletion { default_type text/html; try_files /data-deletion.html =404; }
    # 攻略目录：/blog（不带斜杠，与站内其他规范地址一致）
    location = /blog          { default_type text/html; try_files /blog/index.html =404; }

    # 截图 / 图标：长缓存（改文件名即可失效）
    location ^~ /screens/ { add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
    location ^~ /icons/   { add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
    # 攻略文章：/blog/rules-zh → /blog/rules-zh.html
    location ^~ /blog/    { add_header Cache-Control "no-cache"; try_files $uri $uri.html =404; }

    # 带扩展名的未知路径（旧链接 /xxx.html、扫描器）→ 真 404，避免软 404 被判低质
    location ~ \.[a-zA-Z0-9]+$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 兜底：SPA 路由（/collection、/battle/... 无扩展名）回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Android APK 下载：显式 MIME，避免被当文本/未知类型
    location ^~ /dl/ {
        default_type application/vnd.android.package-archive;
    }
}
