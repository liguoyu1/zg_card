server {
    listen $PORT;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 隐私政策 / 法律法规静态页（应用商店与用户直接访问）
    location = /privacy {
        default_type text/html;
        try_files /privacy.html =404;
    }
    location = /privacy/ {
        default_type text/html;
        try_files /privacy.html =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Android APK 下载：显式 MIME，避免被当文本/未知类型
    location /dl/ {
        default_type application/vnd.android.package-archive;
    }
}
