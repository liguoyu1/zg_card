# -------------------------------------------------------------------
# www → 非 www 规范化重定向（SEO）
# www.wscard.games 一律 301 到 https://wscard.games/ 主域名，
# 避免重复内容与无效索引。此块靠 server_name 精确匹配 Host，
# 其余 Host（含 wscard.games）命中下方默认块正常服务。
# -------------------------------------------------------------------
server {
    listen $PORT;
    server_name www.wscard.games;
    return 301 https://wscard.games$request_uri;
}

server {
    listen $PORT default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # =========================================================
    # 缓存策略（改善重访加载，同时确保新版本能及时发布）
    #
    # Flutter web 产物文件名是固定的（main.dart.mjs / main.dart.wasm
    # / skwasm.js 等都不带内容哈希），所以不能用无条件 immutable——
    # 否则每次构建后浏览器会命中旧缓存看不到更新。
    #
    # 策略：
    #   - 入口/版本控制文件（index.html / flutter_bootstrap.js /
    #     flutter_service_worker.js / version.json）：绝不缓存(no-cache)，
    #     每次用 ETag 校验，确保新版本能发布。
    #   - 引擎与静态资源（canvaskit/ 下 wasm/js、assets/ 下 webp/字体/
    #     图片）：长缓存。这些文件相对稳定，且 Flutter 的 service worker
    #     在版本变化时负责刷新它们，所以加 immutable 能显著改善重访。
    #   - 主应用产物（main.dart.mjs / main.dart.wasm / main.dart.js）：
    #     no-cache，随每次构建变化，必须 revalidate。
    # =========================================================

    # ES module (.mjs) 必须返回 text/javascript，否则浏览器拒绝动态 import
    # （skwasm/dart2wasm 运行时靠 import(main.dart.mjs) 启动）。
    # mime.types 无 .mjs 定义时默认返回 application/octet-stream，
    # 浏览器拒绝动态 import 导致白屏；此 location 强制指定为 JS MIME。
    # 注意：不能在此 server 块用 types{}（会整体替换默认 MIME 映射），
    # 故用 location 级 default_type。
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 主应用产物（wasm / js）：no-cache，配合 ETag 校验
    location ~* \.(wasm|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 入口 / 版本控制文件：绝不缓存
    location = /index.html            { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js  { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /version.json          { add_header Cache-Control "no-cache"; }

    # 引擎与渲染层（skwasm / canvaskit）：长缓存（^~ 使前缀优先于正则）
    location ^~ /canvaskit/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 静态资源（图片 / 字体 / 音频等）：长缓存
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 隐私政策 / 法律法规静态页（应用商店与用户直接访问）
    location = /privacy {
        default_type text/html;
        try_files /privacy.html =404;
    }
    location = /privacy/ {
        default_type text/html;
        try_files /privacy.html =404;
    }

    # 宣传落地页 —— 干净短链接便于投放/分享
    #   /landing  → landing.html （通用宣传页）
    #   /download → download.html（下载专页，各渠道入口）
    #   /promo    → promo.html   （广告投放页）
    #   /about    → about.html   （游戏介绍页）
    location = /landing  { default_type text/html; try_files /landing.html =404; }
    location = /landing/ { default_type text/html; try_files /landing.html =404; }
    location = /download { default_type text/html; try_files /download.html =404; }
    location = /download/{ default_type text/html; try_files /download.html =404; }
    location = /promo    { default_type text/html; try_files /promo.html =404; }
    location = /promo/   { default_type text/html; try_files /promo.html =404; }
    location = /about    { default_type text/html; try_files /about.html =404; }
    location = /about/   { default_type text/html; try_files /about.html =404; }

    # 兜底：默认 no-cache（HTML 等未匹配文件）
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Android APK 下载：显式 MIME，避免被当文本/未知类型
    location /dl/ {
        default_type application/vnd.android.package-archive;
    }
}
